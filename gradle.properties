# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

# Caching disabled on purpose. It causes subtle breakages when running tasks inside and outside sandboxed environments.  
org.gradle.configuration-cache=false
org.gradle.caching=false

# Increase JVM heap for Gradle daemon
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# A Kotlin compile daemon outlives its build and is found through
# ~/.local/share/kotlin, so one started in a sandbox would serve the next
# sandbox, whose worktree its mount namespace cannot see.
kotlin.compiler.execution.strategy=in-process
